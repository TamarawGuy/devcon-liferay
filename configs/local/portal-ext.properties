#
# Feature flags
#
# LPD-35443 gates the operations of the headless-admin-site REST module.
# Verified on this bundle (7.4 GA132) by toggling the flag and restarting:
#
#   flag on   /o/headless-admin-site/v1.0/sites/L_GUEST/site-pages   -> 200
#   flag off  same path                                              -> 400
#             {"status":"BAD_REQUEST","type":"UnsupportedOperationException"}
#
# Same result for master-pages, page-templates, display-page-templates.
#
# Two traps this hides:
#
#   1. Gated operations fail with 400, not 401/403/404. A 400 normally means a
#      malformed request, so the instinct is to re-read your payload. The
#      request is fine; the feature is off.
#
#   2. /o/headless-admin-site/v1.0/openapi.json returns 200 either way. The
#      spec advertises operations the flag will reject, so flag state cannot be
#      inferred from the API explorer at /o/api. Only executing a call proves it.
#
# The single property below is sufficient — the control test above passed with
# only this line present. A `.system=true` variant is not required.
#
# LPD-39244 and LPD-74328 gate REST based page composition, which the
# site-initializer path does not use. Left off deliberately — enable one only
# when a specific call is proven to need it.
#
feature.flag.LPD-35443=true

#
# Local development convenience
#
# Liferay forces a password reset and email verification at first login, which
# invalidates the credentials documented in CLAUDE.md. These keep a freshly
# initialized bundle usable with the documented password.
#
# NOTE: these apply at initBundle time only. They do not retroactively undo a
# password reset that has already happened on an existing bundle.
#
company.security.strangers.verify=false
passwords.default.policy.change.required=false
passwords.default.policy.name=Custom Password Policy
